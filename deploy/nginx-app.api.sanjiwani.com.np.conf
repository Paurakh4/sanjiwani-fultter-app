# PocketBase for the clinic app, behind the existing nginx on this host.
#
# Written as a plain :80 block on purpose: `certbot --nginx` duplicates it for
# 443 and injects the certificate lines, so nothing here has to be edited again
# when the certificate renews.
#
# After installing:  sudo certbot --nginx -d app.api.sanjiwani.com.np

server {
    listen 80;
    listen [::]:80;
    server_name app.api.sanjiwani.com.np;

    # Scanned lab reports and prescription photos.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PocketBase realtime is one long-lived SSE stream per connected app.
        # Buffering would hold those events until a buffer fills, so patients
        # would see booking changes late or not at all.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
    }
}
